<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f0e6" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://yyj-h5-d5gaovp196680d93f-1258663924.ap-shanghai.app.tcloudbase.com https://*.tcloudbase.com; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>栗子的家·定制装饰罩</title>
    <meta name="description" content="输入尺寸，即可完成定制" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="栗子的家·定制装饰罩" />
    <meta property="og:description" content="输入尺寸，即可完成定制" />
    <meta property="og:image" content="https://jonathangeee.github.io/yyj-h5/assets/share-cover.jpg" />
    <meta property="og:image:width" content="500" />
    <meta property="og:image:height" content="500" />
    <meta property="og:url" content="https://jonathangeee.github.io/yyj-h5/" />
    <link rel="image_src" href="https://jonathangeee.github.io/yyj-h5/assets/share-cover.jpg" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="assets/styles/cloud-960.webp"
      imagesrcset="assets/styles/cloud-480.webp 480w, assets/styles/cloud-960.webp 960w"
      imagesizes="(max-width: 480px) 100vw, 480px"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="styles.css?v=1b34bb7abf" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <section class="view" data-view="home">
        <main class="home-v2">
          <section class="home-hero" aria-label="定制案例">
            <div class="case-track" id="caseTrack" aria-label="左右滑动查看案例">
              <article class="case-slide" data-index="0">
                <picture class="case-picture">
                  <source type="image/webp" srcset="assets/styles/cloud-480.webp 480w, assets/styles/cloud-960.webp 960w" sizes="(max-width: 480px) 100vw, 480px" />
                  <img class="case-image is-cover" src="assets/styles/cloud.jpg" alt="云朵弧烟机罩案例" draggable="false" loading="eager" fetchpriority="high" decoding="async" data-fallback="assets/styles/cloud.jpg" />
                </picture>
                <div class="case-shade"></div>
                <div class="case-meta">
                  <h2 class="case-name">云朵弧</h2>
                  <p class="case-spec">钟形弧线 · 宽底收边 · 暖米色</p>
                </div>
              </article>
            </div>
            <button class="case-3d" id="case3d" type="button" aria-label="查看 3D 模型">
              <span class="case-3d-viewport" aria-hidden="true">
                <span class="case-3d-flipper">
                  <img class="case-3d-face case-3d-front" src="assets/models/cloud.png" alt="" draggable="false" />
                  <img class="case-3d-face case-3d-back" alt="" draggable="false" />
                </span>
                <span class="case-3d-canvas" id="case3dCanvas"></span>
              </span>
              <span class="case-3d-label">3D 模型</span>
            </button>
          </section>
          <div class="case-progress" id="caseProgress" aria-label="案例切换">
            <button type="button" data-case-index="0" aria-label="查看案例 1" class="is-active"><span class="case-fill"></span></button>
            <button type="button" data-case-index="1" aria-label="查看案例 2"><span class="case-fill"></span></button>
            <button type="button" data-case-index="2" aria-label="查看案例 3"><span class="case-fill"></span></button>
            <button type="button" data-case-index="3" aria-label="查看案例 4"><span class="case-fill"></span></button>
            <button type="button" data-case-index="4" aria-label="查看案例 5"><span class="case-fill"></span></button>
            <button type="button" data-case-index="5" aria-label="查看案例 6"><span class="case-fill"></span></button>
          </div>
          <button class="home-buy" id="homeStart" type="button">定制同款</button>
          <button class="home-orders" id="homeOrders" type="button">查询订单</button>
          <section class="home-intro">
            <h1>输入尺寸，即可完成定制</h1>
            <div class="advantage-list">
              <p><span>01</span><b>快速</b>量好 3 个尺寸、选好款式，就能下单</p>
              <p><span>02</span><b>方便</b>说明书像宜家，每一步都有 3D 动画</p>
              <p><span>03</span><b>直观</b>所见即所得，自己就是设计师</p>
            </div>
          </section>
        </main>
      </section>
      <section class="view view--orders" data-view="orders">
        <header class="appbar">
          <button class="icon-btn" data-back type="button" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="appbar-title">订单查询</div>
          <span class="appbar-spacer" aria-hidden="true"></span>
        </header>
        <main class="orders-page">
          <div class="orders-body">
            <form class="orders-search" id="orderSearchForm" novalidate>
              <input
                id="orderPhone"
                type="tel"
                inputmode="numeric"
                autocomplete="off"
                maxlength="11"
                placeholder="输入手机号查询订单"
                aria-label="查询订单的手机号"
              />
              <button class="orders-search-btn" type="submit">查询</button>
            </form>
            <div class="orders-results" id="orderResults" aria-live="polite"></div>
          </div>
          <div class="orders-bottom">
            <button class="orders-contact" id="ordersBottomContact" type="button">联系客服</button>
          </div>
        </main>
      </section>
      <section class="view" data-view="order">
        <header class="appbar">
          <button class="icon-btn" data-back type="button" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="appbar-title">订单详情</div>
          <span class="appbar-spacer" aria-hidden="true"></span>
        </header>
        <main class="order-detail" id="orderDetail"></main>
        <div class="order-detail-bar">
          <div class="order-detail-actions">
            <button class="btn btn-ghost" id="orderDrawingBtn" type="button">展开图纸</button>
            <button class="btn btn-primary" id="orderInstallBtn" type="button">安装说明</button>
          </div>
        </div>
      </section>
      <section class="view view--customize" data-view="customize">
        <div class="stage" id="stage">
          <div id="preview3d" class="stage-canvas"></div>
          <div id="previewFallback" class="stage-fallback" aria-hidden="true"></div>
          <header class="stage-bar">
            <button class="icon-btn" data-back type="button" aria-label="返回">
              <svg viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="stage-title">定制装饰罩</div>
            <button class="stage-reset" id="previewReset" data-action="clear" type="button">重置</button>
          </header>
        </div>
        <div class="custom-sheet" id="customSheet">
          <nav class="custom-tabs" id="customizeTabs" role="tablist" aria-label="定制分类">
            <button role="tab" aria-selected="true" aria-controls="upperPanel" data-tab="upper" type="button">上层尺寸</button>
            <button role="tab" aria-selected="false" aria-controls="lowerPanel" data-tab="lower" type="button">下层尺寸</button>
            <button role="tab" aria-selected="false" aria-controls="notchPanel" data-tab="notch" type="button">操作面板</button>
            <button role="tab" aria-selected="false" aria-controls="decorPanel" data-tab="decor" type="button">可选装饰</button>
          </nav>
          <div class="custom-panels">
            <div id="upperPanel" class="custom-panel is-active" data-panel="upper" role="tabpanel">
              <div id="chimneyDims" class="dim-list"></div>
            </div>
            <div id="lowerPanel" class="custom-panel" data-panel="lower" role="tabpanel">
              <div id="hoodDims" class="dim-list"></div>
              <div class="shim-row">
                <div class="dim-label"><b>垫高<button class="dim-help" data-help="shim" type="button" aria-label="垫高是什么">?</button></b></div>
                <div class="stepper">
                  <button type="button" data-shim-step="-5" aria-label="减少垫高"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
                  <b id="shimValue">0</b><span class="unit">mm</span>
                  <button type="button" data-shim-step="5" aria-label="增加垫高"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8M8 4v8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
                </div>
              </div>
            </div>
            <div id="notchPanel" class="custom-panel" data-panel="notch" role="tabpanel">
              <div class="panel-label">豁口形状</div>
              <div id="notchOptions" class="notch-options"></div>
              <div id="notchDims" class="dim-list"></div>
            </div>
            <div id="decorPanel" class="custom-panel" data-panel="decor" role="tabpanel">
              <div class="panel-label">侧面装饰</div>
              <div id="curveOptions" class="curve-options"></div>
              <div class="panel-label" id="startLabel">侧面起始点</div>
              <div id="startOptions" class="segmented"></div>
              <div class="panel-label">装饰条</div>
              <div id="trimList" class="trim-list"></div>
            </div>
          </div>
          <p class="dim-warning" id="dimWarning" aria-live="polite" hidden></p>
          <div class="custom-buybar">
            <button class="bar-guide" id="installGuideBtn" type="button">安装说明</button>
            <button class="btn btn-primary btn-buy" id="nextBtn" type="button">去下单，限时免运费</button>
          </div>
        </div>
      </section>
      <section class="view view--install" data-view="install">
        <div class="install-bg" id="installStage" aria-label="安装步骤三维演示"></div>
        <header class="appbar">
          <button class="icon-btn" data-back type="button" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="appbar-title">安装说明</div>
          <button class="icon-btn" data-help="install" type="button" aria-label="安装帮助">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.6"/><path d="M9.7 9.3a2.4 2.4 0 1 1 3.4 2.2c-.8.4-1.1.9-1.1 1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="16.8" r=".9" fill="currentColor"/></svg>
          </button>
        </header>
        <nav class="install-tabs" id="installTabs" role="tablist" aria-label="安装步骤">
          <button role="tab" aria-selected="true" data-key="base" type="button"><span>①</span>主体拼接</button>
          <button role="tab" aria-selected="false" data-key="curve" type="button"><span>②</span>曲面装饰</button>
          <button role="tab" aria-selected="false" data-key="trim" type="button"><span>③</span>装饰条</button>
          <button role="tab" aria-selected="false" data-key="paint" type="button"><span>④</span>刷漆</button>
        </nav>
        <div class="install-copy" id="installCopy" aria-live="polite">
          <div class="install-copy-text">
            <h2 id="installTitle">主体按顺序拼装</h2>
            <p id="installDesc">有垫高先贴垫板，再装侧板、顶板、正面。</p>
          </div>
          <button id="replayBtn" class="replay-btn" type="button" aria-label="重播动画" title="重播动画">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 9a6 6 0 1 1 1.4 5.4M4 4v5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="buybar">
          <div class="buybar-price"><small>到手价</small><b id="installPrice">¥850</b></div>
          <button class="btn btn-ghost btn-compact" id="installBack" type="button">再改改</button>
          <button class="btn btn-primary btn-buy" id="installNext" type="button">去下单 · <span id="installPriceBtn">¥850</span></button>
        </div>
      </section>
    </div>
      <div id="sheetRoot" class="sheet-root" hidden>
        <div class="sheet-backdrop" data-sheet-close></div>
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
          <div class="sheet-grab" aria-hidden="true"></div>
          <button class="sheet-close" data-sheet-close type="button" aria-label="关闭">
            <svg viewBox="0 0 20 20" fill="none"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <h2 id="sheetTitle"></h2>
          <div id="sheetBody" class="sheet-body"></div>
          <div id="sheetActions" class="sheet-actions"></div>
        </div>
      </div>
    <script type="module" src="app.js?v=0f213c0f73"></script>
  </body>
</html>
